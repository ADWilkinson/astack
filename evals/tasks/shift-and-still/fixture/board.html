<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northline board</title>
<style>
  body { margin: 0; background: #f4f7f8; color: #1c2b33; font: 16px/1.4 "Iowan Old Style", Palatino, serif; }
  header { background: #1c2b33; color: #f4f7f8; padding: 16px 20px; font-weight: 650; }
  table { width: 100%; border-collapse: collapse; background: white; }
  th, td { text-align: left; padding: 12px 20px; border-bottom: 1px solid #d5dee3; }
  th { font: 12px/1.2 sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #5c6e78; }
  .fee { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>Northline</header>
<table>
  <thead><tr><th>Berth</th><th>Length</th><th>Fee</th></tr></thead>
  <tbody>
    <tr><td>Pontoon C, 14</td><td>11 m</td><td class="fee">12%</td></tr>
    <tr><td>Pontoon A, 3</td><td>8 m</td><td class="fee">12%</td></tr>
    <tr><td>Wall, east</td><td>14 m</td><td class="fee">12%</td></tr>
  </tbody>
</table>
</body>
</html>
