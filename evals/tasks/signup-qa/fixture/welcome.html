<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Welcome</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<main class="panel">
  <h1>Welcome, <span id="who"></span></h1>
  <p>Your account is ready. Log your first sighting to get started.</p>
</main>
<script>
  const user = JSON.parse(localStorage.getItem("fieldnotes:user") || "{}");
  document.getElementById("who").textContent = user.name || "";
</script>
</body>
</html>
